name: Migration help with synthetic data
description: Ask about a recipe without sharing private source or credentials.
body:
  - type: markdown
    attributes:
      value: Do not post secrets, account identifiers, customer records, private URLs, environment files or filled migration reports. Use synthetic data only.
  - type: input
    id: recipe
    attributes:
      label: Recipe and toolkit revision
      placeholder: legacy-crm-cards, local example only
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and expected result
      description: Include command names and redacted error categories, not raw transcripts.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed credentials, private identifiers, URLs and customer data.
          required: true
